# add-on

addon.iometer.name = IOmeter Binding
addon.iometer.description = This is the binding for the IOmeter electrical utility meter reading device.

# thing types

thing-type.iometer.device.label = IOmeter
thing-type.iometer.device.description = An IOmeter Bridge providing live electrical utility meter readings via SSE and status via polling.
thing-type.iometer.device.channel.bridge-rssi.label = Bridge WiFi RSSI
thing-type.iometer.device.channel.core-rssi.label = Core RF RSSI
thing-type.iometer.device.channel.energy-import-tariff1.label = Energy Import Tariff 1
thing-type.iometer.device.channel.energy-import-tariff2.label = Energy Import Tariff 2
thing-type.iometer.device.channel.power-phase1.label = Power Phase 1
thing-type.iometer.device.channel.power-phase2.label = Power Phase 2
thing-type.iometer.device.channel.power-phase3.label = Power Phase 3

# thing types config

thing-type.config.iometer.device.hostname.label = Hostname
thing-type.config.iometer.device.hostname.description = Hostname or IP address of the IOmeter Bridge
thing-type.config.iometer.device.statusRefreshInterval.label = Status Refresh Interval
thing-type.config.iometer.device.statusRefreshInterval.description = Interval the /v1/status endpoint is polled in seconds. Live meter readings are pushed continuously via SSE and are not affected by this setting.

# channel types

channel-type.iometer.core-attachment-status.label = Core Attachment Status
channel-type.iometer.core-attachment-status.description = Whether the IOmeter Core is attached to the utility meter's optical port.
channel-type.iometer.core-attachment-status.state.option.attached = Attached
channel-type.iometer.core-attachment-status.state.option.detached = Detached
channel-type.iometer.core-battery-level.label = Core Battery Level
channel-type.iometer.core-battery-level.description = Battery level of the IOmeter Core. Only available when powered by battery.
channel-type.iometer.core-connection-status.label = Core Connection Status
channel-type.iometer.core-connection-status.description = 868MHz RF link status between IOmeter Core and IOmeter Bridge.
channel-type.iometer.core-connection-status.state.option.connected = Connected
channel-type.iometer.core-connection-status.state.option.disconnected = Disconnected
channel-type.iometer.core-pin-status.label = Core PIN Status
channel-type.iometer.core-pin-status.description = Whether the utility meter PIN has been entered on the IOmeter Core.
channel-type.iometer.core-pin-status.state.option.entered = Entered
channel-type.iometer.core-pin-status.state.option.pending = Pending
channel-type.iometer.core-pin-status.state.option.missing = Missing
channel-type.iometer.core-power-status.label = Core Power Status
channel-type.iometer.core-power-status.description = Power supply of the IOmeter Core.
channel-type.iometer.core-power-status.state.option.battery = Battery
channel-type.iometer.core-power-status.state.option.wired = Wired
channel-type.iometer.energy-export.label = Energy Export
channel-type.iometer.energy-export.description = Cumulative energy production (feed-in) counter.
channel-type.iometer.energy-import.label = Energy Import
channel-type.iometer.energy-import.description = Cumulative energy consumption counter.
channel-type.iometer.power-phase.label = Power Phase
channel-type.iometer.power-phase.description = Power on a single phase. Only available when the meter provides per-phase readings.
channel-type.iometer.power.label = Power
channel-type.iometer.power.description = Current net power. Positive means consumption, negative means feed-in.
channel-type.iometer.rssi.label = RSSI
channel-type.iometer.rssi.description = Received signal strength indicator.
